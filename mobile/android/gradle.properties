# Keep enough headroom for Android Studio and the Pixel emulator on a 16 GB host.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Pub cache berada di C: sedangkan workspace di D:. Incremental Kotlin lama gagal
# membuat relative path lintas drive pada plugin Flutter, jadi compile in-process.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
